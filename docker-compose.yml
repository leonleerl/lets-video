services:
  postgres:
    image: postgres:16-alpine
    container_name: letsvideo-postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: letsvideo
      POSTGRES_PASSWORD: letsvideo
      POSTGRES_DB: letsvideo
    volumes:
      - letsvideo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letsvideo -d letsvideo"]
      interval: 5s
      timeout: 5s
      retries: 10
  
volumes:
  letsvideo-pgdata: